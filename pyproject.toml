[project]
name = "lanecheck"
version = "0.1.0"
description = "Probe a store you own to see whether AI shopping agents can reach a checkout session without paying."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "lanecheck contributors"}]
keywords = ["ucp", "acp", "agents", "commerce", "checkout"]
dependencies = [
  "cryptography>=43",
  "jsonschema>=4.23",
]

[project.scripts]
lanecheck = "lanecheck.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Documentation = "https://github.com/Universal-Commerce-Protocol/ucp"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
